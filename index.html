<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
  
  <title>Frontend Mentor | Order summary card</title>
</head>
<body>
  <main class="container">
    <img src="./images/illustration-hero.svg" alt="Person listening to music illustration" class="card__hero">

    <section class="card__body">
      <h1 class="card__title">Order Summary</h1>
      <p class="card__text">You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!</p>

      <div class="plan" aria-label="Order plan details">
        <div class="plan__row">
          <div class="plan__icon">
            <img src="./images/icon-music.svg" alt="Music icon" width="24" height="24">
          </div>
          <div class="plan__details">
            <p class="plan__name">Annual Plan</p>
            <p class="plan__cost">$59.99/year</p>
          </div>
          <a href="#" class="plan__action">Change</a>
        </div>
      </div>

      <button type="button" class="button">Proceed to Payment</button>
      <a href="#" class="cancel">Cancel Order</a>
    </section>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
